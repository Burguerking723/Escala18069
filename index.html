<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Escala BK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        body{
            background:linear-gradient(135deg,#ff7b00,#d62300);
            min-height:100vh;
            display:flex;
        }
        aside{
            width:260px;
            background:#222;
            color:white;
            padding:25px;
            box-shadow:5px 0 15px rgba(0,0,0,.2);
        }
        .logo{
            text-align:center;
            margin-bottom:35px;
        }
        .logo h1{
            font-size:28px;
        }
        .logo p{
            font-size:13px;
            opacity:.7;
        }
        .menu a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px;
            margin-bottom:10px;
            border-radius:12px;
            transition:.3s;
            font-weight:500;
        }
        .menu a:hover, .menu a.ativo{
            background:#d62300;
            transform:translateX(8px);
        }
        main{
            flex:1;
            padding:30px;
            overflow:auto;
        }
        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
            flex-wrap:wrap;
            gap:15px;
        }
        header h2{
            color:white;
            font-size:32px;
        }
        .relogio{
            background:white;
            padding:12px 20px;
            border-radius:12px;
            font-weight:600;
            color:#d62300;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }
        .mes-ano{
            background:white;
            padding:12px 15px;
            border-radius:12px;
            color:#d62300;
            font-weight:600;
            display:flex;
            gap:8px;
            align-items:center;
        }
        .mes-ano input{
            width:70px;
            padding:5px;
            border:1px solid #d62300;
            border-radius:6px;
            text-align:center;
            font-weight:600;
        }
        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:20px;
            margin-bottom:30px;
        }
        .card{
            background:white;
            border-radius:20px;
            padding:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
            transition:.3s;
        }
        .card:hover{
